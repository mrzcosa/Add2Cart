services:
  - type: web
    name: add2cart-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_ORIGINS
        sync: false
    disk:
      name: add2cart-data
      mountPath: /var/data
      sizeGB: 1
